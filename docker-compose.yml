version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/var/www
    ports:
      - "9000:9000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - CORS_ALLOWED_ORIGINS=http://localhost:8081
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 768M # Aumentado para suportar melhor o backend
          cpus: "0.75"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
    ports:
      - "8081:8081" # Certifique-se de usar a porta correta no mapeamento
    deploy:
      resources:
        limits:
          memory: 512M # Aumentado para suportar a recompilação do frontend
          cpus: "0.50"

  db:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: password_generator_db
      MYSQL_USER: password_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

volumes:
  db_data:
