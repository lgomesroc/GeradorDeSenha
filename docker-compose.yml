version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - ./backend:/var/www
    ports:
      - "9000:9000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - CORS_ALLOWED_ORIGINS=http://localhost:8081
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  db:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: password_generator_db
      MYSQL_USER: password_user # Defina um usuário regular
      MYSQL_PASSWORD: password123 # Senha para o usuário regular
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.00"

volumes:
  db_data:
